[package]
name = "sandbox-driver-boxd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "boxd.sh microVM sandbox provider for sandbox-driver"

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
futures-util.workspace = true
prost = "0.14"
reqwest = { workspace = true, features = ["json", "rustls"] }
sandbox-driver.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { workspace = true, features = ["io"] }
tonic = { version = "=0.14.5", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "=0.14.5"
tracing.workspace = true

[build-dependencies]
protox = "0.10"
tonic-prost-build = { version = "=0.14.5", default-features = false, features = ["transport"] }

[dev-dependencies]
sandbox-driver-conformance.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tonic = { version = "=0.14.5", default-features = false, features = ["channel", "codegen", "router", "server", "tls-ring", "tls-webpki-roots"] }
